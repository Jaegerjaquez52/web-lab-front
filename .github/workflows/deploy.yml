name: Deploy client to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Validate deployment configuration
        run: |
          test -n "$VITE_API_URL" || { echo "Set repository variable VITE_API_URL"; exit 1; }
          test -n "$VITE_SOCKET_URL" || { echo "Set repository variable VITE_SOCKET_URL"; exit 1; }
          test -n "$NETLIFY_SITE_ID" || { echo "Set repository variable NETLIFY_SITE_ID"; exit 1; }
          test -n "$NETLIFY_AUTH_TOKEN" || { echo "Set repository secret NETLIFY_AUTH_TOKEN"; exit 1; }
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_SOCKET_URL: ${{ vars.VITE_SOCKET_URL }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      - name: Build production client
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_SOCKET_URL: ${{ vars.VITE_SOCKET_URL }}
      - name: Deploy production site
        run: npx --yes netlify-cli deploy --prod --dir=dist --site="$NETLIFY_SITE_ID"
        env:
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
